trigger:
  branches:
    include:
    - release/*

stages:
- stage: BuildNative
  displayName: 'Build Native CCefView'
  jobs:
  - job: Windows
    displayName: 'Build CCefView (Windows)'
    pool:
      vmImage: 'windows-latest'
    steps:
    - checkout: self
      submodules: recursive
    
    - task: CMake@1
      displayName: 'Configure & Generate CCefView (Win x64)'
      inputs:
        workingDirectory: 'CCefView'
        cmakeArgs: '-S . -B .build/windows.x86_64 -A x64 -DPROJECT_ARCH=x86_64'
    
    - task: CMake@1
      displayName: 'Build CCefView (Win x64)'
      inputs:
        workingDirectory: 'CCefView'
        cmakeArgs: '--build .build/windows.x86_64 --config Release'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish CCefView Output (Win)'
      inputs:
        targetPath: 'CCefView/output'
        artifact: 'CCefView_Windows'

  - job: macOS
    displayName: 'Build CCefView (macOS)'
    pool:
      vmImage: 'macos-latest'
    steps:
    - checkout: self
      submodules: recursive

    - task: CMake@1
      displayName: 'Configure CCefView (macOS x64)'
      inputs:
        workingDirectory: 'CCefView'
        cmakeArgs: '-G Xcode -S . -B .build/macos.x86_64 -DPROJECT_ARCH=x86_64'
    
    - task: CMake@1
      displayName: 'Build CCefView (macOS x64)'
      inputs:
        workingDirectory: 'CCefView'
        cmakeArgs: '--build .build/macos.x86_64 --config Release'

    - task: CMake@1
      displayName: 'Configure CCefView (macOS arm64)'
      inputs:
        workingDirectory: 'CCefView'
        cmakeArgs: '-G Xcode -S . -B .build/macos.arm64 -DPROJECT_ARCH=arm64'
    
    - task: CMake@1
      displayName: 'Build CCefView (macOS arm64)'
      inputs:
        workingDirectory: 'CCefView'
        cmakeArgs: '--build .build/macos.arm64 --config Release'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish CCefView Output (macOS)'
      inputs:
        targetPath: 'CCefView/output'
        artifact: 'CCefView_macOS'

- stage: BuildDotNet
  displayName: 'Build .NET Packages'
  dependsOn: BuildNative
  jobs:
  - job: Avalonia
    displayName: 'Build DNCefView.Avalonia'
    pool:
      vmImage: 'windows-latest'
    steps:
    - checkout: self

    - pwsh: |
        $branch = "$(Build.SourceBranch)"
        if ($branch -match "refs/heads/release/(.*)") {
            $version = $matches[1]
            Write-Host "Detected version: $version"
            $path = "Directory.Build.props"
            (Get-Content $path) -replace '<Version>.*</Version>', "<Version>$version</Version>" | Set-Content $path
            Write-Host "Updated $path with version $version"
        } else {
            Write-Error "Branch $branch does not match release/* pattern"
            exit 1
        }
      displayName: 'Update Version from Branch'

    - task: UseDotNet@2
      displayName: 'Use .NET SDK 8.x'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Windows Binaries'
      inputs:
        artifact: 'CCefView_Windows'
        path: '$(Build.SourcesDirectory)/CCefView/output'

    - task: DownloadPipelineArtifact@2
      displayName: 'Download macOS Binaries'
      inputs:
        artifact: 'CCefView_macOS'
        path: '$(Build.SourcesDirectory)/CCefView/output'

    - task: DotNetCoreCLI@2
      displayName: 'Build DNCefView.Avalonia (Release)'
      inputs:
        command: 'build'
        projects: 'DNCefView.Avalonia/DNCefView.Avalonia.csproj'
        arguments: '--configuration Release'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Avalonia Packages'
      inputs:
        targetPath: '.artifacts/package/release'
        artifact: 'DNCefView_Avalonia_Packages'